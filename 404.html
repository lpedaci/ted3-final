<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Puerta no encontrada · Final de recorrido</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#04041C">
  <link rel="icon" href="/ted3-final/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=Figtree:wght@400;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font: 400 17px/1.55 "Figtree", system-ui, sans-serif; color: #FCFCFC;
      background: linear-gradient(180deg, #04041C 0 45%, #0C0C3C 45% 65%, #24185C 65% 80%, #44186C 80% 100%);
    }
    main {
      max-width: 560px; width: 100%; padding: 32px 28px 36px; text-align: center;
      background: rgba(0, 0, 0, .9);
      box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #FCFCFC, inset 0 0 0 6px #000;
    }
    .code { font: 400 22px/1 "VT323", monospace; letter-spacing: .2em; color: #FCA044; }
    h1 { font: 400 clamp(2.2rem, 9vw, 3.2rem)/1.05 "VT323", monospace; margin: 12px 0; }
    p { margin: 0 0 24px; color: #BCBCBC; }
    a {
      display: inline-block; padding: 12px 22px; min-height: 48px;
      font: 400 1.4rem/1 "VT323", monospace; letter-spacing: .06em; text-transform: uppercase; text-decoration: none;
      color: #000; background: #FCE0A8;
    }
    a::before { content: "▶ "; color: #E44028; }
    a:hover { background: #FCFCFC; }
    a:focus-visible { outline: 2px dashed #FCFCFC; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="code">ERROR 404</div>
    <h1>Esta puerta no existe.</h1>
    <p>El enlace que seguiste no lleva a ninguna sala del recorrido.</p>
    <a href="/ted3-final/">Volver al recorrido</a>
  </main>
</body>
</html>
